<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 430" width="100%" height="100%">
  <defs>
    <linearGradient id="stack-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="50%" stop-color="#091122" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>
    <linearGradient id="stack-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.7" />
    </linearGradient>
    <pattern id="stack-dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    
    @keyframes orbitPulse {
      0%, 100% { stroke-opacity: 0.25; }
      50% { stroke-opacity: 0.6; }
    }
    .orbit-1 { stroke: #247bff; animation: orbitPulse 4s ease-in-out infinite; }
    .orbit-2 { stroke: #8b5cf6; animation: orbitPulse 5s ease-in-out infinite 1s; }
    .orbit-3 { stroke: #ff354f; animation: orbitPulse 6s ease-in-out infinite 2s; }

    @keyframes nodeFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    .node-anim { animation: nodeFloat 3s ease-in-out infinite; }
  </style>

  <rect x="2" y="2" width="846" height="426" rx="20" fill="url(#stack-bg)" stroke="url(#stack-border)" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="426" rx="20" fill="url(#stack-dots)" />

  <!-- HEADER -->
  <g transform="translate(45, 30)">
    <text x="0" y="16" fill="#38bdf8" font-size="12" font-weight="700" class="mono" letter-spacing="1.5">TECH ARSENAL &amp; ORBITS</text>
    <text x="0" y="40" fill="#ffffff" font-size="22" font-weight="800" class="sans">Multi-Tier Technology Stack</text>
  </g>

  <!-- ORBITS GRAPHIC (Center: 425, 175) -->
  <g transform="translate(425, 170)">
    <!-- Orbit 1 (Inner - Frontend: tilted -15deg) -->
    <ellipse cx="0" cy="0" rx="170" ry="55" fill="none" stroke-width="1.8" class="orbit-1" transform="rotate(-15)" stroke-dasharray="6 3" />
    <!-- Orbit 2 (Middle - Backend: tilted 12deg) -->
    <ellipse cx="0" cy="0" rx="260" ry="72" fill="none" stroke-width="1.8" class="orbit-2" transform="rotate(12)" stroke-dasharray="8 4" />
    <!-- Orbit 3 (Outer - Cloud & DevOps: tilted -6deg) -->
    <ellipse cx="0" cy="0" rx="350" ry="90" fill="none" stroke-width="1.8" class="orbit-3" transform="rotate(-6)" stroke-dasharray="10 5" />

    <!-- Center Core Badge -->
    <circle cx="0" cy="0" r="38" fill="#0c162e" stroke="#247bff" stroke-width="2" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#ff354f" stroke-width="1" stroke-opacity="0.4">
      <animate attributeName="r" values="42;52;42" dur="3s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="-5" fill="#60a5fa" font-size="10" font-weight="700" class="mono" text-anchor="middle">NISHANT</text>
    <text x="0" y="12" fill="#ffffff" font-size="13" font-weight="800" class="sans" text-anchor="middle">CORE</text>

    <!-- Planetary Nodes on Orbits -->
    <!-- Orbit 1 Nodes (Frontend: React, TypeScript, Next.js, Tailwind) -->
    <g transform="translate(-130, -35)" class="node-anim">
      <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#0b172a" stroke="#61dafb" stroke-width="1.5" />
      <text x="0" y="4" fill="#61dafb" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">⚛️ React</text>
    </g>
    <g transform="translate(130, 30)" class="node-anim">
      <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#0b172a" stroke="#3178c6" stroke-width="1.5" />
      <text x="0" y="4" fill="#93c5fd" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(20, -55)" class="node-anim">
      <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#0b172a" stroke="#ffffff" stroke-width="1.2" />
      <text x="0" y="4" fill="#ffffff" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">▲ Next.js</text>
    </g>

    <!-- Orbit 2 Nodes (Backend: Node.js, Express, MongoDB, PostgreSQL) -->
    <g transform="translate(-230, 20)" class="node-anim">
      <rect x="-40" y="-14" width="80" height="28" rx="14" fill="#0b172a" stroke="#68a063" stroke-width="1.5" />
      <text x="0" y="4" fill="#86efac" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">🟢 Node.js</text>
    </g>
    <g transform="translate(225, -25)" class="node-anim">
      <rect x="-42" y="-14" width="84" height="28" rx="14" fill="#0b172a" stroke="#47a248" stroke-width="1.5" />
      <text x="0" y="4" fill="#4ade80" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">🍃 MongoDB</text>
    </g>
    <g transform="translate(-80, 68)" class="node-anim">
      <rect x="-38" y="-14" width="76" height="28" rx="14" fill="#0b172a" stroke="#cbd5e1" stroke-width="1.2" />
      <text x="0" y="4" fill="#e2e8f0" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">Express</text>
    </g>
    <g transform="translate(90, -70)" class="node-anim">
      <rect x="-45" y="-14" width="90" height="28" rx="14" fill="#0b172a" stroke="#336791" stroke-width="1.5" />
      <text x="0" y="4" fill="#60a5fa" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">🐘 Postgres</text>
    </g>

    <!-- Orbit 3 Nodes (Cloud & Tools: Docker, Git, REST APIs, Linux) -->
    <g transform="translate(-310, -45)" class="node-anim">
      <rect x="-38" y="-14" width="76" height="28" rx="14" fill="#0b172a" stroke="#2496ed" stroke-width="1.5" />
      <text x="0" y="4" fill="#38bdf8" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">🐳 Docker</text>
    </g>
    <g transform="translate(315, 45)" class="node-anim">
      <rect x="-35" y="-14" width="70" height="28" rx="14" fill="#0b172a" stroke="#f05032" stroke-width="1.5" />
      <text x="0" y="4" fill="#f87171" font-size="11.5" font-weight="700" class="mono" text-anchor="middle">🌱 Git/GH</text>
    </g>
  </g>

  <!-- GROUPED STACK CHIPS AT BOTTOM -->
  <g transform="translate(45, 305)">
    <rect x="0" y="0" width="760" height="100" rx="14" fill="#091224" stroke="#247bff" stroke-width="1" stroke-opacity="0.3" />

    <!-- Tier 1: Frontend -->
    <g transform="translate(20, 16)">
      <text x="0" y="16" fill="#38bdf8" font-size="11" font-weight="700" class="mono">FRONTEND:</text>
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="72" height="24" rx="6" fill="#1e293b" />
        <text x="36" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">React.js</text>
        
        <rect x="80" y="0" width="70" height="24" rx="6" fill="#1e293b" />
        <text x="115" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Next.js</text>
        
        <rect x="158" y="0" width="90" height="24" rx="6" fill="#1e293b" />
        <text x="203" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">TypeScript</text>
        
        <rect x="256" y="0" width="90" height="24" rx="6" fill="#1e293b" />
        <text x="301" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">JavaScript</text>
        
        <rect x="354" y="0" width="95" height="24" rx="6" fill="#1e293b" />
        <text x="401" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">TailwindCSS</text>
        
        <rect x="457" y="0" width="85" height="24" rx="6" fill="#1e293b" />
        <text x="499" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">HTML5/CSS3</text>
        
        <rect x="550" y="0" width="75" height="24" rx="6" fill="#1e293b" />
        <text x="587" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Redux/Zustand</text>
      </g>
    </g>

    <!-- Tier 2: Backend & Systems -->
    <g transform="translate(20, 52)">
      <text x="0" y="16" fill="#ff354f" font-size="11" font-weight="700" class="mono">BACKEND:</text>
      <g transform="translate(90, 0)">
        <rect x="0" y="0" width="72" height="24" rx="6" fill="#1e293b" />
        <text x="36" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Node.js</text>
        
        <rect x="80" y="0" width="70" height="24" rx="6" fill="#1e293b" />
        <text x="115" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Express</text>
        
        <rect x="158" y="0" width="75" height="24" rx="6" fill="#1e293b" />
        <text x="195" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">MongoDB</text>
        
        <rect x="241" y="0" width="88" height="24" rx="6" fill="#1e293b" />
        <text x="285" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">PostgreSQL</text>
        
        <rect x="337" y="0" width="85" height="24" rx="6" fill="#1e293b" />
        <text x="379" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">REST APIs</text>
        
        <rect x="430" y="0" width="65" height="24" rx="6" fill="#1e293b" />
        <text x="462" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Docker</text>
        
        <rect x="503" y="0" width="55" height="24" rx="6" fill="#1e293b" />
        <text x="530" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Git</text>

        <rect x="566" y="0" width="65" height="24" rx="6" fill="#1e293b" />
        <text x="598" y="16" fill="#f1f5f9" font-size="11" font-weight="600" class="sans" text-anchor="middle">Postman</text>
      </g>
    </g>
  </g>
</svg>