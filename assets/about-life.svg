<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <linearGradient id="about-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>
    <linearGradient id="about-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0.6" />
    </linearGradient>
    <pattern id="about-dots" x="0" y="0" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#247bff" fill-opacity="0.1" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* 3-slide carousel progress bar animations (4s each, 12s cycle) */
    @keyframes bar1Anim {
      0% { width: 0; opacity: 1; }
      30% { width: 100px; opacity: 1; }
      33% { width: 100px; opacity: 0.3; }
      99% { width: 100px; opacity: 0.3; }
      100% { width: 0; opacity: 1; }
    }
    @keyframes bar2Anim {
      0%, 33% { width: 0; opacity: 0.3; }
      34% { width: 0; opacity: 1; }
      63% { width: 100px; opacity: 1; }
      66% { width: 100px; opacity: 0.3; }
      100% { width: 100px; opacity: 0.3; }
    }
    @keyframes bar3Anim {
      0%, 66% { width: 0; opacity: 0.3; }
      67% { width: 0; opacity: 1; }
      96% { width: 100px; opacity: 1; }
      99% { width: 100px; opacity: 0.3; }
      100% { width: 0; opacity: 0.3; }
    }
    .progress-bar-1 { animation: bar1Anim 12s infinite linear; }
    .progress-bar-2 { animation: bar2Anim 12s infinite linear; }
    .progress-bar-3 { animation: bar3Anim 12s infinite linear; }

    /* 3-slide content fade */
    @keyframes slide1Fade {
      0%, 30% { opacity: 1; transform: translateX(0); }
      33%, 97% { opacity: 0; transform: translateX(10px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slide2Fade {
      0%, 32% { opacity: 0; transform: translateX(-10px); }
      34%, 63% { opacity: 1; transform: translateX(0); }
      66%, 100% { opacity: 0; transform: translateX(10px); }
    }
    @keyframes slide3Fade {
      0%, 65% { opacity: 0; transform: translateX(-10px); }
      67%, 96% { opacity: 1; transform: translateX(0); }
      99%, 100% { opacity: 0; transform: translateX(10px); }
    }
    .slide-1 { animation: slide1Fade 12s infinite; }
    .slide-2 { animation: slide2Fade 12s infinite; }
    .slide-3 { animation: slide3Fade 12s infinite; }
  </style>

  <rect x="2" y="2" width="846" height="336" rx="20" fill="url(#about-bg-grad)" stroke="url(#about-border)" stroke-width="1.5" />
  <rect x="2" y="2" width="846" height="336" rx="20" fill="url(#about-dots)" />

  <!-- LEFT: Capabilities (x=35 to 400) -->
  <g transform="translate(35, 30)">
    <text x="0" y="20" fill="#38bdf8" font-size="12" font-weight="700" class="mono" letter-spacing="1.5">CORE CAPABILITIES</text>
    <text x="0" y="44" fill="#ffffff" font-size="20" font-weight="800" class="sans">Engineering &amp; Architecture</text>

    <!-- Capability 1 -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="365" height="58" rx="10" fill="#0d172d" stroke="#247bff" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="26" cy="29" r="14" fill="#247bff" fill-opacity="0.15" />
      <text x="26" y="34" font-size="14" text-anchor="middle">🚀</text>
      <text x="50" y="24" fill="#f1f5f9" font-size="13" font-weight="700" class="sans">Full-Stack Architecture</text>
      <text x="50" y="42" fill="#94a3b8" font-size="11.5" class="sans">End-to-end MERN &amp; Next.js platforms with robust APIs.</text>
    </g>

    <!-- Capability 2 -->
    <g transform="translate(0, 133)">
      <rect x="0" y="0" width="365" height="58" rx="10" fill="#0d172d" stroke="#247bff" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="26" cy="29" r="14" fill="#ff354f" fill-opacity="0.15" />
      <text x="26" y="34" font-size="14" text-anchor="middle">⚡</text>
      <text x="50" y="24" fill="#f1f5f9" font-size="13" font-weight="700" class="sans">Real-Time Data &amp; Security</text>
      <text x="50" y="42" fill="#94a3b8" font-size="11.5" class="sans">JWT authentication, WebSockets, MongoDB &amp; PostgreSQL.</text>
    </g>

    <!-- Capability 3 -->
    <g transform="translate(0, 201)">
      <rect x="0" y="0" width="365" height="58" rx="10" fill="#0d172d" stroke="#247bff" stroke-width="1" stroke-opacity="0.3" />
      <circle cx="26" cy="29" r="14" fill="#00e5a3" fill-opacity="0.15" />
      <text x="26" y="34" font-size="14" text-anchor="middle">🛡️</text>
      <text x="50" y="24" fill="#f1f5f9" font-size="13" font-weight="700" class="sans">Clean Code &amp; Scalability</text>
      <text x="50" y="42" fill="#94a3b8" font-size="11.5" class="sans">Strict TypeScript, Dockerized workflows, performance tuning.</text>
    </g>
  </g>

  <!-- DIVIDER LINE -->
  <line x1="425" y1="35" x2="425" y2="305" stroke="#247bff" stroke-opacity="0.2" stroke-dasharray="4 4" />

  <!-- RIGHT: 3-Slide Carousel (x=450 to 815) -->
  <g transform="translate(450, 30)">
    <text x="0" y="20" fill="#ff354f" font-size="12" font-weight="700" class="mono" letter-spacing="1.5">INTERESTS &amp; PASSIONS</text>
    <text x="0" y="44" fill="#ffffff" font-size="20" font-weight="800" class="sans">Beyond The Codebase</text>

    <!-- 3 Segment Progress Bars -->
    <g transform="translate(0, 62)">
      <!-- Segment 1 BG -->
      <rect x="0" y="0" width="105" height="4" rx="2" fill="#1e293b" />
      <rect x="0" y="0" width="0" height="4" rx="2" fill="#247bff" class="progress-bar-1" />

      <!-- Segment 2 BG -->
      <rect x="125" y="0" width="105" height="4" rx="2" fill="#1e293b" />
      <rect x="125" y="0" width="0" height="4" rx="2" fill="#a855f7" class="progress-bar-2" />

      <!-- Segment 3 BG -->
      <rect x="250" y="0" width="105" height="4" rx="2" fill="#1e293b" />
      <rect x="250" y="0" width="0" height="4" rx="2" fill="#00e5a3" class="progress-bar-3" />
    </g>

    <!-- Carousel Container Box -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="365" height="180" rx="14" fill="#0b1324" stroke="#247bff" stroke-width="1" stroke-opacity="0.3" />

      <!-- SLIDE 1 -->
      <g class="slide-1" transform="translate(25, 25)">
        <circle cx="20" cy="20" r="18" fill="#247bff" fill-opacity="0.2" />
        <text x="20" y="26" font-size="18" text-anchor="middle">💻</text>
        <text x="50" y="26" fill="#38bdf8" font-size="15" font-weight="700" class="sans">Building Practical Products</text>
        
        <text x="0" y="65" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">Passionate about side-projects that solve</text>
        <text x="0" y="85" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">real problems—like collaborative trading</text>
        <text x="0" y="105" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">platforms and developer utilities.</text>
        
        <rect x="0" y="120" width="130" height="22" rx="4" fill="#247bff" fill-opacity="0.15" />
        <text x="65" y="135" fill="#60a5fa" font-size="10" font-weight="700" class="mono" text-anchor="middle">PROJECT BUILDER</text>
      </g>

      <!-- SLIDE 2 -->
      <g class="slide-2" transform="translate(25, 25)">
        <circle cx="20" cy="20" r="18" fill="#a855f7" fill-opacity="0.2" />
        <text x="20" y="26" font-size="18" text-anchor="middle">🏎️</text>
        <text x="50" y="26" fill="#c084fc" font-size="15" font-weight="700" class="sans">Hackathons &amp; Innovation</text>
        
        <text x="0" y="65" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">Active hackathon participant (Intellithon-26).</text>
        <text x="0" y="85" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">Enjoy designing architecture under tight</text>
        <text x="0" y="105" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">deadlines with modern frameworks.</text>
        
        <rect x="0" y="120" width="130" height="22" rx="4" fill="#a855f7" fill-opacity="0.15" />
        <text x="65" y="135" fill="#c084fc" font-size="10" font-weight="700" class="mono" text-anchor="middle">INTELLITHON '26</text>
      </g>

      <!-- SLIDE 3 -->
      <g class="slide-3" transform="translate(25, 25)">
        <circle cx="20" cy="20" r="18" fill="#00e5a3" fill-opacity="0.2" />
        <text x="20" y="26" font-size="18" text-anchor="middle">🤝</text>
        <text x="50" y="26" fill="#34d399" font-size="15" font-weight="700" class="sans">Open Source &amp; Mentoring</text>
        
        <text x="0" y="65" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">Believer in peer code reviews, continuous</text>
        <text x="0" y="85" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">learning, open-source repositories, and</text>
        <text x="0" y="105" fill="#e2e8f0" font-size="13" font-weight="600" class="sans">collaborating with fellow developers.</text>
        
        <rect x="0" y="120" width="130" height="22" rx="4" fill="#00e5a3" fill-opacity="0.15" />
        <text x="65" y="135" fill="#34d399" font-size="10" font-weight="700" class="mono" text-anchor="middle">COMMUNITY DRIVEN</text>
      </g>
    </g>
  </g>
</svg>