<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Nishant Sharma — Software Engineer &amp; Problem Solver</title><desc id="desc">Animated navy, blue, and crimson GitHub profile header.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#111c32"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <clipPath id="reveal"><rect x="52" y="80" width="0" height="100"><animate attributeName="width" from="0" to="670" dur="1.4s" fill="freeze"/></rect></clipPath>
</defs>
<rect width="1000" height="330" rx="24" fill="url(#bg)"/><path d="M0 3H1000" stroke="url(#line)" stroke-width="6"/>
<g opacity=".14" fill="#8ba8d9"><circle cx="800" cy="55" r="2"/><circle cx="840" cy="80" r="2"/><circle cx="880" cy="55" r="2"/><circle cx="920" cy="80" r="2"/><circle cx="960" cy="55" r="2"/><circle cx="800" cy="100" r="2"/><circle cx="840" cy="125" r="2"/><circle cx="880" cy="100" r="2"/><circle cx="920" cy="125" r="2"/><circle cx="960" cy="100" r="2"/></g>
<text x="52" y="48" font-family="monospace" font-size="15" letter-spacing="2" fill="#9aa9c4">NISHANT SHARMA  /  DEVELOPER PROFILE</text>
<text x="52" y="126" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800" fill="#f5f7ff" clip-path="url(#reveal)">SOFTWARE ENGINEER</text>
<text x="52" y="178" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="800" fill="#247bff"> &amp; PROBLEM SOLVER</text>
<text x="54" y="222" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#a9b6cd">Building practical products. Learning by shipping.</text>
<rect x="52" y="254" width="300" height="42" rx="11" fill="#101a2d" stroke="#2a3b5a"/>
<text x="72" y="280" font-family="monospace" font-size="14" fill="#ff5267">const mindset = "build + learn";</text>
<g transform="translate(785 113)">
 <rect x="0" y="0" width="155" height="155" rx="24" fill="#0c1424" stroke="#344765" stroke-width="2"/>
 <circle cx="77" cy="53" r="27" fill="#1d3150" stroke="#247bff" stroke-width="2"/>
 <path d="M30 132 Q34 83 77 83 Q120 83 124 132Z" fill="#1d3150" stroke="#247bff" stroke-width="2"/>
 <text x="77" y="151" text-anchor="middle" font-family="monospace" font-size="9" fill="#a9b6cd">ADD YOUR PORTRAIT</text>
 <circle cx="123" cy="24" r="7" fill="#ff354f"><animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/></circle>
</g>
</svg>